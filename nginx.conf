server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (Best Practices: CSP/HSTS/COOP/COOP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    # HSTS: only active on HTTPS (port 443 block below); harmless on :80
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Tight CSP that still allows Vite inline module + Cloudinary/API/images
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://api.mibnews.in https://www.mibnews.in https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://api.mibnews.in https://www.google-analytics.com https://region1.google-analytics.com https://res.cloudinary.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' blob: data: https://res.cloudinary.com https://api.mibnews.in; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/ld+json application/x-javascript text/x-component font/opentype application/x-font-ttf application/x-font-opentype application/vnd.ms-fontobject image/svg+xml;

    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/ld+json;

    # Cache static assets - long term caching with immutable flag
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache HTML files for a short time
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Service worker - no cache
    location /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Manifest - short cache
    location /manifest.json {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # API proxy (same-origin /api -> backend, preserves /api prefix)
    location /api/ {
        proxy_pass http://backend:5003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploads proxy (same-origin /uploads -> backend static)
    location /uploads/ {
        proxy_pass http://backend:5003/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
        
        # Add security headers for HTML responses
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Performance optimizations
    # Enable HTTP/2 (requires SSL)
    # listen 443 ssl http2;
    
    # TLS session caching
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    
    # OCSP stapling
    # ssl_stapling on;
    # ssl_stapling_verify on;
}